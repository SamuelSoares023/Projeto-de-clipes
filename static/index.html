<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ClipLive AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col items-center p-4 font-sans">

  <div class="w-full max-w-md space-y-6 mt-4">
    <!-- Cabeçalho -->
    <div class="text-center space-y-1">
      <h1 class="text-3xl font-extrabold bg-gradient-to-r from-purple-400 to-pink-500 bg-clip-text text-transparent">
        ClipLive AI
      </h1>
      <p class="text-sm text-zinc-400">Cole o link da live e gere cortes verticais prontos</p>
    </div>

    <!-- Formulário -->
    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-4 space-y-4 shadow-lg">
      <div>
        <label class="block text-xs font-medium text-zinc-400 mb-1">Link da Live (YouTube, Twitch, etc.)</label>
        <input id="urlInput" type="url" placeholder="https://www.youtube.com/watch?v=..."
          class="w-full bg-zinc-950 border border-zinc-700 rounded-xl px-3 py-3 text-sm focus:outline-none focus:border-purple-500" />
      </div>

      <div class="flex items-center justify-between">
        <label class="text-xs font-medium text-zinc-400">Quantidade de cortes:</label>
        <select id="numClips" class="bg-zinc-950 border border-zinc-700 rounded-lg px-3 py-1.5 text-sm">
          <option value="2">2 cortes</option>
          <option value="3" selected>3 cortes</option>
          <option value="5">5 cortes</option>
        </select>
      </div>

      <button id="submitBtn" onclick="startClipping()"
        class="w-full bg-purple-600 hover:bg-purple-500 active:scale-95 transition font-semibold py-3 rounded-xl text-sm">
        Gerar Cortes
      </button>
    </div>

    <!-- Status -->
    <div id="statusBox" class="hidden bg-zinc-900 border border-zinc-800 rounded-2xl p-4 text-center space-y-2">
      <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-purple-500 mx-auto"></div>
      <p id="statusText" class="text-sm font-medium text-purple-300">Processando...</p>
      <p class="text-xs text-zinc-500">Isso pode levar alguns minutos dependendo do tamanho da live.</p>
    </div>

    <!-- Erro -->
    <div id="errorBox" class="hidden bg-red-950/60 border border-red-800 rounded-2xl p-4 text-sm text-red-300"></div>

    <!-- Resultados -->
    <div id="results" class="space-y-4 pb-10"></div>
  </div>

  <script>
    let pollInterval = null;

    async function startClipping() {
      const url = document.getElementById("urlInput").value.trim();
      const numClips = parseInt(document.getElementById("numClips").value);
      if (!url) return alert("Cole o link da live primeiro.");

      document.getElementById("submitBtn").disabled = true;
      document.getElementById("submitBtn").classList.add("opacity-50");
      document.getElementById("statusBox").classList.remove("hidden");
      document.getElementById("errorBox").classList.add("hidden");
      document.getElementById("results").innerHTML = "";

      try {
        const res = await fetch("/api/process", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url, num_clips: numClips })
        });
        const data = await res.json();
        pollStatus(data.job_id);
      } catch (err) {
        showError("Erro ao conectar com o servidor.");
      }
    }

    function pollStatus(jobId) {
      pollInterval = setInterval(async () => {
        try {
          const res = await fetch(`/api/status/${jobId}`);
          const data = await res.json();

          if (data.status === "done") {
            clearInterval(pollInterval);
            document.getElementById("statusBox").classList.add("hidden");
            resetButton();
            renderClips(data.clips);
          } else if (data.status === "error") {
            clearInterval(pollInterval);
            showError("Erro no processamento: " + data.error);
          } else {
            document.getElementById("statusText").innerText = data.status;
          }
        } catch (err) {
          clearInterval(pollInterval);
          showError("Conexão perdida com o servidor.");
        }
      }, 3000);
    }

    function renderClips(clips) {
      const container = document.getElementById("results");
      clips.forEach((clip, i) => {
        container.innerHTML += `
          <div class="bg-zinc-900 border border-zinc-800 rounded-2xl overflow-hidden shadow-lg">
            <video src="${clip.url}" controls playsinline class="w-full max-h-96 bg-black"></video>
            <div class="p-4 space-y-2">
              <div class="flex justify-between items-start gap-2">
                <h3 class="font-bold text-base leading-tight">${clip.title}</h3>
                <span class="text-xs bg-zinc-800 text-zinc-300 px-2 py-1 rounded-md shrink-0">${clip.start} - ${clip.end}</span>
              </div>
              <p class="text-xs text-zinc-400">${clip.reason}</p>
              <a href="${clip.url}" download="corte_${i+1}.mp4"
                class="block w-full text-center bg-emerald-600 hover:bg-emerald-500 font-semibold py-2.5 rounded-xl text-sm mt-2">
                Baixar Corte (MP4)
              </a>
            </div>
          </div>
        `;
      });
    }

    function showError(msg) {
      document.getElementById("statusBox").classList.add("hidden");
      const box = document.getElementById("errorBox");
      box.innerText = msg;
      box.classList.remove("hidden");
      resetButton();
    }

    function resetButton() {
      const btn = document.getElementById("submitBtn");
      btn.disabled = false;
      btn.classList.remove("opacity-50");
    }
  </script>
</body>
</html>
